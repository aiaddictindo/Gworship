<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penutup Sekolah Minggu - Luar Angkasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Tema Dasar - Luar Angkasa */
        body {
            margin: 0;
            overflow: hidden;
            /* Latar belakang biru dongker sangat gelap ke ungu pekat */
            background: radial-gradient(circle at center, #1b0033 0%, #0a001a 50%, #000000 100%);
            font-family: 'Mali', cursive;
            color: #ffffff;
        }

        .font-space {
            font-family: 'Fredoka One', cursive;
        }

        /* --- ORNAMEN CSS (Planet & Roket) --- */

        /* Planet Bumi (Kiri Atas) */
        .planet-earth {
            position: absolute;
            top: 10%;
            left: 5%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, #4facfe, #00458e);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(79, 172, 254, 0.4), inset -15px -15px 30px rgba(0,0,0,0.5);
            z-index: 2;
            animation: floatSlow 8s infinite alternate ease-in-out;
        }

        /* Bercak Hijau (Pulau) di Bumi */
        .planet-earth::before {
            content: '';
            position: absolute;
            top: 20%; left: 20%;
            width: 60px; height: 40px;
            background: #43a047;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }
        .planet-earth::after {
            content: '';
            position: absolute;
            bottom: 20%; right: 10%;
            width: 70px; height: 50px;
            background: #43a047;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }

        /* Planet Saturnus (Kanan Bawah) */
        .planet-saturn {
            position: absolute;
            bottom: 10%;
            right: 5%;
            width: 180px;
            height: 180px;
            z-index: 2;
            animation: floatSlow 10s infinite alternate-reverse ease-in-out;
        }
        
        /* Bola Saturnus */
        .saturn-body {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 120px; height: 120px;
            background: radial-gradient(circle at 30% 30%, #ffd54f, #f57f17);
            border-radius: 50%;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5);
        }

        /* Cincin Saturnus */
        .saturn-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(20deg) rotateX(70deg);
            width: 220px; height: 220px;
            border: 15px solid rgba(255, 235, 59, 0.6);
            border-radius: 50%;
            border-top-color: transparent; /* Supaya terlihat seperti mengelilingi belakang */
        }

        /* Roket SVG (Terbang Melintas) */
        .rocket-container {
            position: absolute;
            z-index: 3;
            /* Mulai dari luar layar kiri bawah */
            bottom: -200px;
            left: -200px;
            width: 100px;
            height: 100px;
            /* Animasi terbang menyilang */
            animation: flyRocket 15s infinite linear;
        }

        .rocket {
            width: 100%;
            height: 100%;
            /* Arahkan roket ke kanan atas */
            transform: rotate(45deg);
        }

        @keyframes flyRocket {
            0% { transform: translate(0, 0); }
            100% { transform: translate(150vw, -150vh); }
        }

        @keyframes floatSlow {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(5deg); }
        }

        /* --- ANIMASI TEKS --- */
        .pop-in {
            opacity: 0;
            transform: scale(0.5);
            animation: popInAnim 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1.5s; }
        .delay-3 { animation-delay: 2.5s; }

        @keyframes popInAnim {
            to { opacity: 1; transform: scale(1); }
        }

        /* Kotak Panel Neon (Gaya Luar Angkasa) */
        .space-panel {
            background: rgba(10, 0, 40, 0.7);
            backdrop-filter: blur(8px);
            border: 4px solid #00f2fe;
            border-radius: 30px;
            box-shadow: 0 0 20px #00f2fe, inset 0 0 20px rgba(0, 242, 254, 0.3);
            position: relative;
        }

        /* Teks Kuning Neon */
        .text-neon-yellow {
            color: #ffeb3b;
            text-shadow: 0 0 10px #ffeb3b, 0 0 20px #f57f17;
        }
        
        /* Teks Biru Neon */
        .text-neon-blue {
            color: #00e5ff;
            text-shadow: 0 0 8px #00e5ff;
        }
    </style>
</head>
<body class="h-screen w-screen relative flex flex-col items-center justify-center">

    <!-- Planet CSS -->
    <div class="planet-earth"></div>
    <div class="planet-saturn">
        <div class="saturn-ring"></div>
        <div class="saturn-body"></div>
    </div>

    <!-- Roket yang terbang melintasi layar -->
    <div class="rocket-container">
        <!-- SVG Roket Sederhana -->
        <svg class="rocket" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Api Ekzos -->
            <path d="M12 22C12 22 9 19 9 16C9 13 15 13 15 16C15 19 12 22 12 22Z" fill="#ff5722"/>
            <path d="M12 20C12 20 10.5 18 10.5 16C10.5 14 13.5 14 13.5 16C13.5 18 12 20 12 20Z" fill="#ffeb3b"/>
            <!-- Sayap -->
            <path d="M12 2L4 14V17L9 15V19H15V15L20 17V14L12 2Z" fill="#00bcd4"/>
            <!-- Badan Roket -->
            <path d="M12 2C12 2 7 7 7 14C7 16 17 16 17 14C17 7 12 2 12 2Z" fill="#eeeeee"/>
            <!-- Jendela -->
            <circle cx="12" cy="10" r="2.5" fill="#1b0033" stroke="#00bcd4" stroke-width="1"/>
        </svg>
    </div>

    <!-- Kanvas untuk Bintang Meluncur (Warp Speed) -->
    <canvas id="warpCanvas" class="absolute inset-0 z-1 pointer-events-none"></canvas>

    <!-- Konten Utama Teks -->
    <div class="relative z-10 flex flex-col items-center justify-center w-full h-full text-center px-4">
        
        <div class="space-panel pop-in py-10 px-8 md:py-12 md:px-16 max-w-4xl w-full mx-auto flex flex-col items-center transform -rotate-1">
            
            <h1 class="font-space text-5xl md:text-7xl mb-4 text-neon-yellow tracking-widest uppercase">
                Misi Selesai! 🚀
            </h1>
            
            <h2 class="font-space text-2xl md:text-4xl text-white mb-8">
                Tuhan Yesus Menciptakan
                <span class="text-neon-blue block mt-2 text-4xl md:text-6xl">Alam Semesta yang Luar Biasa!</span>
            </h2>

            <!-- Pesan Interaktif Ala Komandan -->
            <div class="pop-in delay-1 bg-blue-900/60 rounded-2xl p-5 mb-8 w-full border border-blue-400/50">
                <p class="font-bold text-xl md:text-2xl text-blue-100 leading-snug">
                    Pesan Komandan: <br>
                    <span class="text-yellow-300 font-space text-2xl md:text-3xl mt-1 inline-block">"Teruslah Bersinar Seperti Bintang!" ✨</span>
                </p>
            </div>

            <!-- Tombol Penutup -->
            <div class="pop-in delay-2 mt-4">
                <div class="bg-gradient-to-r from-purple-600 to-blue-600 py-4 px-10 rounded-full border-2 border-white shadow-[0_0_15px_rgba(255,255,255,0.5)]">
                    <p class="font-space text-2xl md:text-3xl text-white tracking-wider">
                        Sampai Jumpa Minggu Depan! 🛸
                    </p>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript untuk Efek Warp Speed (Bintang Meluncur) - Max 30 FPS -->
    <script>
        const canvas = document.getElementById('warpCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const numStars = 150; // Jumlah bintang untuk efek warp

        // Titik pusat layar (untuk efek meluncur dari tengah)
        let centerX, centerY;

        // --- SISTEM LIMIT FPS (Max 30) ---
        const targetFPS = 30; 
        const frameDelay = 1000 / targetFPS;
        let lastTime = 0;
        // ---------------------------------

        function initSize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            
            // Re-init stars on resize
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push(new WarpStar());
            }
        }

        class WarpStar {
            constructor() {
                this.reset();
                // Acak Z awal agar saat pertama load bintang sudah tersebar, tidak muncul barengan dari tengah
                this.z = Math.random() * width; 
            }

            reset() {
                // Koordinat X dan Y disebar di seluruh kanvas (asumsi tengah adalah 0,0)
                this.x = (Math.random() - 0.5) * width * 2; 
                this.y = (Math.random() - 0.5) * height * 2;
                // Z adalah kedalaman (jarak). Mulai dari paling jauh (sama dengan lebar layar)
                this.z = width;
                // Kecepatan meluncur mendekat
                this.speed = Math.random() * 5 + 2; 
                // Warna (putih atau agak kebiruan/kuning)
                const colors = ['#ffffff', '#00e5ff', '#ffeb3b'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                // Simpan posisi sebelumnya untuk menggambar garis jejak (trail)
                this.pz = this.z;
            }

            update() {
                // Bintang bergerak mendekat (Z berkurang)
                this.z -= this.speed;

                // Jika bintang sudah melewati layar (Z < 1), reset kembali ke kejauhan
                if (this.z < 1) {
                    this.reset();
                }
            }

            draw() {
                // Konversi koordinat 3D (x, y, z) ke 2D layar
                
                // Posisi saat ini
                let sx = (this.x / this.z) * 100 + centerX;
                let sy = (this.y / this.z) * 100 + centerY;
                
                // Ukuran bintang membesar saat mendekat
                let r = (1 - this.z / width) * 3;

                // Posisi di frame sebelumnya (untuk membuat jejak garis/trail)
                let px = (this.x / this.pz) * 100 + centerX;
                let py = (this.y / this.pz) * 100 + centerY;
                
                // Update pz untuk frame berikutnya
                this.pz = this.z;

                // Jika bintang mendadak pindah dari belakang ke depan, jangan gambar garisnya
                if (this.pz > this.z + 10) return;

                // Gambar garis jejak cahaya (Warp effect)
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.lineWidth = r;
                ctx.strokeStyle = this.color;
                // Opacity berdasarkan jarak (semakin dekat semakin terang)
                ctx.globalAlpha = 1 - (this.z / width);
                ctx.stroke();
            }
        }

        window.addEventListener('resize', initSize);
        initSize(); // Inisialisasi pertama

        // Loop Animasi (Throttled max 30 FPS)
        function animate(timestamp) {
            requestAnimationFrame(animate);

            const elapsed = timestamp - lastTime;

            // Render hanya jika frame delay tercapai
            if (elapsed > frameDelay) {
                lastTime = timestamp - (elapsed % frameDelay);

                // Bersihkan layar dengan efek jejak (trailing)
                // Menggunakan rgba transparan alih-alih clearRect agar garis bintang agak panjang
                ctx.fillStyle = 'rgba(10, 0, 26, 0.4)'; // Warna biru sangat gelap transparan
                ctx.fillRect(0, 0, width, height);
                
                for (let i = 0; i < numStars; i++) {
                    stars[i].update();
                    stars[i].draw();
                }
                
                // Kembalikan alpha ke 1 agar tidak mengganggu proses lain
                ctx.globalAlpha = 1;
            }
        }

        // Mulai!
        requestAnimationFrame(animate);
    </script>
</body>
</html>
