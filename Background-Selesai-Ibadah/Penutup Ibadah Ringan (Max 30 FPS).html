<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penutup Ibadah - Ringan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Custom Styles - Menggunakan CSS sederhana untuk performa maksimal */
        body {
            margin: 0;
            overflow: hidden;
            /* Latar belakang gradien senja/malam yang tenang */
            background: linear-gradient(to bottom, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: #ffffff;
            font-family: 'Merriweather', serif;
        }

        .font-title {
            font-family: 'Playfair Display', serif;
        }

        /* Animasi CSS sederhana untuk teks (berjalan sekali) */
        .fade-in {
            animation: fadeIn 4s ease-in-out forwards;
            opacity: 0;
        }

        .slide-up {
            animation: slideUp 3s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .delay-1 { animation-delay: 1.5s; }
        .delay-2 { animation-delay: 3s; }
        .delay-3 { animation-delay: 4.5s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Siluet bukit bawah menggunakan CSS (lebih ringan daripada gambar) */
        .hills {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            background: #020617; /* Warna gelap bukit */
            clip-path: polygon(0% 100%, 100% 100%, 100% 40%, 80% 20%, 60% 45%, 40% 15%, 20% 50%, 0% 30%);
            z-index: 5;
        }

        .hills-back {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35vh;
            background: #0f172a;
            clip-path: polygon(0% 100%, 100% 100%, 100% 25%, 75% 55%, 50% 15%, 25% 45%, 0% 10%);
            z-index: 4;
            opacity: 0.7;
        }

        /* Warna teks emas klasik */
        .text-classic-gold {
            color: #fbbf24; /* Tailwind amber-400 */
        }
    </style>
</head>
<body class="h-screen w-screen relative flex flex-col items-center justify-center">

    <!-- Canvas untuk Bintang Berkelip (dibatasi FPS-nya) -->
    <canvas id="starCanvas" class="absolute inset-0 z-0"></canvas>

    <!-- Siluet Pemandangan Bawah -->
    <div class="hills-back"></div>
    <div class="hills"></div>

    <!-- Kontainer Teks Utama -->
    <div class="relative z-10 flex flex-col items-center justify-center w-full h-full text-center px-4 pb-16">
        
        <!-- Teks Utama -->
        <h1 class="font-title slide-up text-5xl md:text-6xl lg:text-8xl font-bold mb-6 tracking-normal text-classic-gold drop-shadow-lg">
            Syalom
        </h1>
        
        <h2 class="font-title slide-up delay-1 text-2xl md:text-4xl text-white font-medium mb-12 drop-shadow-md">
            Selamat Hari Minggu
        </h2>

        <!-- Teks Pesan -->
        <div class="fade-in delay-2 bg-black/30 p-6 md:p-8 rounded-2xl backdrop-blur-sm border border-white/10 max-w-3xl">
            <p class="text-xl md:text-2xl text-gray-200 leading-relaxed italic font-light mb-4">
                "Kiranya anugerah Tuhan Yesus Kristus, kasih Allah, dan persekutuan Roh Kudus menyertai kamu sekalian."
            </p>
            <p class="text-base text-gray-400">
                2 Korintus 13:14
            </p>
        </div>

        <!-- Teks Sampai Jumpa -->
        <div class="fade-in delay-3 mt-16">
            <p class="text-lg md:text-2xl text-amber-200 tracking-wider">
                Sampai berjumpa kembali di ibadah selanjutnya.
            </p>
        </div>

    </div>

    <!-- JavaScript untuk Animasi Bintang (Dilimit 20-30 FPS) -->
    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const stars = [];
        const numStars = 150; // Jumlah bintang yang cukup untuk layar tapi ringan

        // --- FPS CONTROL ---
        const targetFPS = 24; // Target FPS yang aman (mirip format film)
        const frameDelay = 1000 / targetFPS;
        let lastTime = 0;
        // -------------------

        function initSize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', initSize);
        initSize();

        // Objek Bintang
        class Star {
            constructor() {
                this.x = Math.random() * width;
                // Bintang hanya ada di area langit (80% ke atas)
                this.y = Math.random() * (height * 0.8);
                // Ukuran sangat kecil agar tidak makan memori gambar
                this.radius = Math.random() * 1.5;
                // Kecepatan kelap-kelip
                this.alphaChange = (Math.random() * 0.02) + 0.005;
                this.alpha = Math.random();
                this.increasing = Math.random() > 0.5;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }

            update() {
                // Update opacity untuk efek kelap-kelip (twinkle)
                if (this.increasing) {
                    this.alpha += this.alphaChange;
                    if (this.alpha >= 1) {
                        this.alpha = 1;
                        this.increasing = false;
                    }
                } else {
                    this.alpha -= this.alphaChange;
                    if (this.alpha <= 0) {
                        this.alpha = 0;
                        this.increasing = true;
                        // Pindah posisi sedikit saat bintang "mati" (redup 0)
                        this.x = Math.random() * width;
                        this.y = Math.random() * (height * 0.8);
                    }
                }
            }
        }

        // Buat bintang
        for (let i = 0; i < numStars; i++) {
            stars.push(new Star());
        }

        // Loop Animasi yang di-Throttling
        function animate(timestamp) {
            // Meminta frame berikutnya ke browser
            requestAnimationFrame(animate);

            // Cek selisih waktu
            const elapsed = timestamp - lastTime;

            // JIKA selisih waktu sudah melewati target delay per frame (misal 1/24 detik)
            // MAKA jalankan kode gambar ulang (render)
            if (elapsed > frameDelay) {
                // Update lastTime (disesuaikan agar tidak meleset seiring waktu)
                lastTime = timestamp - (elapsed % frameDelay);

                // --- KODE GAMBAR MULAI DARI SINI ---
                
                // Bersihkan layar
                ctx.clearRect(0, 0, width, height);
                
                // Update dan gambar ulang semua bintang
                for (let i = 0; i < numStars; i++) {
                    stars[i].update();
                    stars[i].draw();
                }
                
                // --- KODE GAMBAR SELESAI ---
            }
            // JIKA belum lewat frameDelay, lewati saja frame ini (hemat CPU/GPU)
        }

        // Memulai animasi
        requestAnimationFrame(animate);
    </script>
</body>
</html>
