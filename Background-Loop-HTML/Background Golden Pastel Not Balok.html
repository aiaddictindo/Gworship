<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Pastel Music Loop</title>
    <style>
        /* RESET & FULLSCREEN SETUP */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0a0806;
            /* Latar belakang gelap hangat agar warna golden pastel menyala */
            background: radial-gradient(circle at 50% 50%, #2a2015 0%, #0a0806 100%);
        }

        /* CANVAS UNTUK VEKTOR ANIMASI */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* EFEK CAHAYA ATMOSFER (GLOWING OVERLAY) */
        .ambient-glow {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 120%, rgba(255, 215, 120, 0.15) 0%, transparent 60%);
            animation: breatheGlow 8s infinite ease-in-out alternate;
        }

        @keyframes breatheGlow {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- Overlay Efek Cahaya -->
    <div class="ambient-glow"></div>

    <!-- Canvas Render Vektor (Tanpa Teks) -->
    <canvas id="musicCanvas"></canvas>

    <script>
        const canvas = document.getElementById('musicCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Palet Warna Golden Pastel
        const goldenColors = [
            '255, 235, 153', // Light Pastel Gold
            '255, 215, 115', // Soft Warm Gold
            '242, 189, 76',  // Deep Pastel Gold
            '255, 248, 204'  // Very Pale Gold (Highlight)
        ];

        // FUNGSI RESPONSIVE: Auto-Fit Layar
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- FUNGSI MENGGAMBAR VEKTOR NOT BALOK (TANPA FONT) ---

        // 1. Not Seperempat (Quarter Note)
        function drawQuarterNote(ctx) {
            ctx.beginPath();
            ctx.ellipse(0, 0, 9, 6.5, -Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(6, 0);
            ctx.lineTo(6, -38);
            ctx.lineWidth = 2.5;
            ctx.stroke();
        }

        // 2. Not Kedelapan (Eighth Note)
        function drawEighthNote(ctx) {
            // Kepala & Tiang
            drawQuarterNote(ctx);
            // Bendera (Flag)
            ctx.beginPath();
            ctx.moveTo(6, -38);
            ctx.bezierCurveTo(20, -25, 20, -5, 6, -3);
            ctx.bezierCurveTo(14, -15, 14, -28, 6, -32);
            ctx.fill();
        }

        // 3. Not Kedelapan Ganda (Beamed Eighth Notes)
        function drawBeamedNote(ctx) {
            // Kepala 1
            ctx.beginPath();
            ctx.ellipse(-14, 0, 9, 6.5, -Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();
            // Kepala 2
            ctx.beginPath();
            ctx.ellipse(14, -5, 9, 6.5, -Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();
            // Tiang
            ctx.beginPath();
            ctx.moveTo(-8, 0);
            ctx.lineTo(-8, -38);
            ctx.moveTo(20, -5);
            ctx.lineTo(20, -43);
            ctx.lineWidth = 2.5;
            ctx.stroke();
            // Balok Penghubung (Beam)
            ctx.beginPath();
            ctx.moveTo(-9, -38);
            ctx.lineTo(21, -43);
            ctx.lineTo(21, -36);
            ctx.lineTo(-9, -31);
            ctx.fill();
        }

        // --- SISTEM PARTIKEL ANIMASI LOOP ---
        class FloatingElement {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.isDust = Math.random() > 0.4; // 60% debu cahaya, 40% not balok
                this.x = Math.random() * width;
                
                // Jika baru dimuat, sebarkan di seluruh layar. Jika reset loop, mulai dari bawah
                this.y = initial ? Math.random() * height : height + 100 + Math.random() * 100;
                
                if (this.isDust) {
                    this.size = Math.random() * 2.5 + 0.5;
                    this.speedY = -(0.2 + Math.random() * 0.8);
                    this.opacity = 0.1 + Math.random() * 0.5;
                } else {
                    this.size = 0.4 + Math.random() * 0.8;
                    this.speedY = -(0.5 + Math.random() * 1.2);
                    this.opacity = 0.15 + Math.random() * 0.6;
                    this.type = Math.floor(Math.random() * 3);
                    this.angle = (Math.random() - 0.5) * 0.6;
                    this.spin = (Math.random() - 0.5) * 0.01;
                }

                this.speedX = (Math.random() - 0.5) * 0.5;
                this.color = goldenColors[Math.floor(Math.random() * goldenColors.length)];
                this.swayOffset = Math.random() * Math.PI * 2;
                this.swaySpeed = 0.005 + Math.random() * 0.015;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.swayOffset) * 0.6;
                this.swayOffset += this.swaySpeed;
                
                if (!this.isDust) {
                    this.angle += this.spin;
                }

                // Loop tanpa batas: Jika keluar batas atas, kembalikan ke bawah
                if (this.y < -100 || this.x < -50 || this.x > width + 50) {
                    this.reset(false);
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Konfigurasi Warna & Cahaya (Glowing Effect)
                ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
                ctx.strokeStyle = `rgba(${this.color}, ${this.opacity})`;
                ctx.shadowBlur = this.isDust ? 10 : 20;
                ctx.shadowColor = `rgba(${this.color}, ${this.opacity})`;

                if (this.isDust) {
                    // Gambar debu cahaya (Golden Dust)
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Gambar Not Balok
                    ctx.rotate(this.angle);
                    ctx.scale(this.size, this.size);
                    
                    if (this.type === 0) drawQuarterNote(ctx);
                    else if (this.type === 1) drawEighthNote(ctx);
                    else drawBeamedNote(ctx);
                }

                ctx.restore();
            }
        }

        // Inisialisasi Partikel (Jumlah responsif menyesuaikan lebar layar)
        function initParticles() {
            particles = [];
            let particleCount = Math.floor(width / 15); // Responsif: HP lebih sedikit, PC lebih banyak
            for (let i = 0; i < particleCount; i++) {
                particles.push(new FloatingElement());
            }
        }
        initParticles();
        window.addEventListener('resize', initParticles);

        // --- ANIMATION LOOP UTAMA ---
        function animate() {
            // Bersihkan kanvas di setiap frame (meninggalkan sedikit trail/jejak sangat tipis)
            ctx.clearRect(0, 0, width, height);

            // Update & Gambar semua objek
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw(ctx);
            }

            requestAnimationFrame(animate);
        }

        // Jalankan Animasi
        animate();

    </script>
</body>
</html>
