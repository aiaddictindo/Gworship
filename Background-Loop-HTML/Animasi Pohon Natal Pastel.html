<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pastel Christmas Tree Loop</title>
    <style>
        /* RESET & FULLSCREEN SETUP */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Mencegah scrollbar */
            /* Gradient Langit Malam Pastel (Twilight) */
            background: linear-gradient(180deg, #3d3b54 0%, #665a77 50%, #9c8e9f 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay bayangan halus (Vignette) untuk memfokuskan pandangan ke tengah */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, transparent 40%, rgba(30, 25, 45, 0.4) 100%);
            z-index: 2;
            pointer-events: none; /* Agar tidak menghalangi interaksi jika ada */
        }
    </style>
</head>
<body>

    <div class="vignette"></div>
    <canvas id="christmasCanvas"></canvas>

    <script>
        const canvas = document.getElementById('christmasCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let snowflakes = [];
        let treeLights = [];
        let time = 0;

        // Palet Warna Pastel
        const LIGHT_COLORS = ['#ffb7b2', '#e2f0cb', '#b5ead7', '#c7ceea', '#fdfd96']; // Pink, Green, Blue, Purple, Yellow
        const TREE_COLOR_TOP = '#a8e6cf';
        const TREE_COLOR_BOTTOM = '#6db898';
        const WOOD_COLOR = '#d4b59e';
        const STAR_COLOR = '#fff9c4';

        // Fungsi inisialisasi ukuran dan objek
        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            initSnow();
            initTreeLights();
        }

        // --- SISTEM PARTIKEL SALJU ---
        function initSnow() {
            snowflakes = [];
            const numFlakes = Math.floor((width * height) / 10000); // Kerapatan dinamis berdasarkan layar
            for (let i = 0; i < numFlakes; i++) {
                snowflakes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 2.5 + 0.5,
                    speedY: Math.random() * 1 + 0.5,
                    speedX: (Math.random() - 0.5) * 0.5,
                    sway: Math.random() * Math.PI * 2
                });
            }
        }

        function drawSnow() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            snowflakes.forEach(flake => {
                // Pergerakan
                flake.y += flake.speedY;
                flake.sway += 0.015;
                flake.x += Math.sin(flake.sway) * 0.3 + flake.speedX;

                // Reset jika melewati layar (Infinite Loop)
                if (flake.y > height) {
                    flake.y = -10;
                    flake.x = Math.random() * width;
                }
                if (flake.x > width) flake.x = 0;
                if (flake.x < 0) flake.x = width;

                ctx.moveTo(flake.x, flake.y);
                ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
            });
            ctx.fill();
        }

        // --- BUKIT SALJU PASTEL ---
        function drawHills() {
            // Bukit Belakang
            ctx.fillStyle = '#dcdde8';
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.85);
            ctx.quadraticCurveTo(width * 0.4, height * 0.75, width, height * 0.9);
            ctx.lineTo(width, height);
            ctx.fill();

            // Bukit Depan
            ctx.fillStyle = '#f4f6f9';
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.9);
            ctx.quadraticCurveTo(width * 0.3, height * 0.8, width * 0.6, height * 0.95);
            ctx.quadraticCurveTo(width * 0.8, height * 1.0, width, height * 0.88);
            ctx.lineTo(width, height);
            ctx.fill();
        }

        // --- SISTEM POHON & LAMPU ---
        function initTreeLights() {
            treeLights = [];
            const centerX = width / 2;
            // Responsif: ukuran pohon bergantung pada lebar/tinggi layar
            const baseSize = Math.min(width, height) * 0.18; 
            const baseY = height * 0.82; 
            const levels = 3;

            // Generate titik lampu di dalam area segitiga pohon
            for (let i = 0; i < levels; i++) {
                const levelY = baseY - (i * baseSize * 1.1);
                const levelWidth = baseSize * (2.8 - i * 0.7);
                const topY = levelY - baseSize * 1.8;

                const numLights = 20 - (i * 5); // Semakin ke atas semakin sedikit lampunya
                for (let j = 0; j < numLights; j++) {
                    // Matematika koordinat Barycentric untuk mendistribusikan lampu dalam segitiga
                    let r1 = Math.random();
                    let r2 = Math.random();
                    if (r1 + r2 > 1) {
                        r1 = 1 - r1;
                        r2 = 1 - r2;
                    }
                    
                    let lx = centerX + r1 * (-levelWidth) + r2 * (levelWidth);
                    let ly = topY + r1 * (levelY - topY) + r2 * (levelY - topY);

                    // Tambahkan margin agar lampu tidak terlalu di ujung daun
                    if (ly > topY + 20 && ly < levelY - 10) {
                        treeLights.push({
                            x: lx,
                            y: ly,
                            color: LIGHT_COLORS[Math.floor(Math.random() * LIGHT_COLORS.length)],
                            r: baseSize * 0.05 + Math.random() * 2,
                            phase: Math.random() * Math.PI * 2,
                            speed: 0.02 + Math.random() * 0.04
                        });
                    }
                }
            }
        }

        function drawTreeAndLights(currentTime) {
            const centerX = width / 2;
            const baseSize = Math.min(width, height) * 0.18;
            const baseY = height * 0.82;
            const levels = 3;

            // 1. Batang Pohon
            ctx.fillStyle = WOOD_COLOR;
            ctx.beginPath();
            ctx.roundRect(centerX - baseSize * 0.25, baseY - baseSize, baseSize * 0.5, baseSize * 1.5, 5);
            ctx.fill();

            // 2. Daun Pohon (Segitiga Bertingkat)
            for (let i = 0; i < levels; i++) {
                const levelY = baseY - (i * baseSize * 1.1);
                const levelWidth = baseSize * (2.8 - i * 0.7);
                const topY = levelY - baseSize * 1.8;

                // Gradient per lapisan untuk efek kedalaman
                let grd = ctx.createLinearGradient(centerX, topY, centerX, levelY);
                grd.addColorStop(0, TREE_COLOR_TOP);
                grd.addColorStop(1, TREE_COLOR_BOTTOM);

                ctx.fillStyle = grd;
                ctx.beginPath();
                // Menggunakan kurva halus di bagian bawah daun
                ctx.moveTo(centerX, topY);
                ctx.lineTo(centerX - levelWidth, levelY);
                ctx.quadraticCurveTo(centerX, levelY + baseSize * 0.2, centerX + levelWidth, levelY);
                ctx.closePath();
                
                // Tambahkan bayangan untuk membedakan tiap layer
                ctx.shadowColor = 'rgba(0,0,0,0.15)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 10;
                ctx.fill();
                
                // Reset shadow
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
            }

            // 3. Render Lampu Pastel (Blinking Animation)
            treeLights.forEach(light => {
                light.phase += light.speed;
                // Osilasi opacity menggunakan Sin wave (berkedip halus)
                const alpha = 0.3 + Math.abs(Math.sin(light.phase)) * 0.7; 

                ctx.beginPath();
                ctx.arc(light.x, light.y, light.r, 0, Math.PI * 2);
                ctx.fillStyle = light.color;
                
                // Efek Glowing menyala
                ctx.globalAlpha = alpha;
                ctx.shadowBlur = 12 * alpha;
                ctx.shadowColor = light.color;
                ctx.fill();
                
                // Reset untuk partikel berikutnya
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            });

            // 4. Bintang Puncak (Berputar dan Berdenyut)
            const starY = baseY - ((levels - 1) * baseSize * 1.1) - baseSize * 1.8;
            drawStar(centerX, starY, 5, baseSize * 0.45, baseSize * 0.2, currentTime);
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius, t) {
            let rot = Math.PI / 2 * 3;
            let step = Math.PI / spikes;

            ctx.save();
            ctx.translate(cx, cy);
            
            // Animasi melayang naik turun sedikit & membesar/mengecil (pulse)
            const hover = Math.sin(t * 2) * 5;
            const pulse = 1 + Math.sin(t * 3) * 0.1;
            
            ctx.translate(0, hover);
            ctx.scale(pulse, pulse);

            ctx.beginPath();
            ctx.moveTo(0, -outerRadius);
            for (let i = 0; i < spikes; i++) {
                let x = Math.cos(rot) * outerRadius;
                let y = Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = Math.cos(rot) * innerRadius;
                y = Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(0, -outerRadius);
            ctx.closePath();

            // Warna Bintang Pastel Menyala
            ctx.fillStyle = STAR_COLOR;
            ctx.shadowBlur = 25 * pulse;
            ctx.shadowColor = STAR_COLOR;
            ctx.fill();
            
            ctx.restore();
        }

        // --- ANIMATION LOOP ---
        function animate() {
            // Delta time sederhana berbasis requestAnimationFrame
            time += 0.016; 

            // Bersihkan frame (Latar belakang CSS akan terlihat)
            ctx.clearRect(0, 0, width, height);
            
            // Urutan render sangat penting (Z-Index imitasi)
            drawSnow();
            drawHills();
            drawTreeAndLights(time);

            requestAnimationFrame(animate);
        }

        // --- EVENT LISTENERS ---
        window.addEventListener('resize', init);

        // --- MEMULAI ---
        init();
        animate();
    </script>
</body>
</html>
