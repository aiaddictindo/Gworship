<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snowman Pastel Night Loop</title>
    <style>
        /* ========================================================
           1. RESET & FULLSCREEN SETUP
        ======================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* Palet Malam Pastel: Navy gelap ke Ungu Lavender kalem */
            background: linear-gradient(180deg, #11142B 0%, #21264E 40%, #3B3C68 80%, #565578 100%);
            font-family: sans-serif;
        }

        /* ========================================================
           2. ELEMEN LATAR BELAKANG (BINTANG, BULAN & AWAN)
        ======================================================== */
        /* Lapisan Bintang Berkelap-kelip */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .star-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(1.5px 1.5px at 15vw 20vh, #FFF, transparent),
                radial-gradient(2px 2px at 35vw 45vh, #FFF, transparent),
                radial-gradient(1px 1px at 55vw 10vh, #FFF, transparent),
                radial-gradient(2px 2px at 75vw 60vh, #FFF, transparent),
                radial-gradient(1.5px 1.5px at 85vw 25vh, #FFF, transparent),
                radial-gradient(1px 1px at 95vw 80vh, #FFF, transparent),
                radial-gradient(2px 2px at 10vw 70vh, #FFF, transparent),
                radial-gradient(1.5px 1.5px at 45vw 15vh, #FFF, transparent),
                radial-gradient(1px 1px at 65vw 85vh, #FFF, transparent);
            opacity: 0.3;
            animation: twinkle 4s infinite alternate ease-in-out;
        }
        
        .star-layer:nth-child(2) {
            transform: rotate(180deg);
            animation-delay: -2s;
            animation-duration: 5s;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; }
            100% { opacity: 0.7; }
        }

        /* Bulan Purnama Pastel */
        .moon {
            position: absolute;
            top: 12vh;
            right: 15vw;
            width: 100px;
            height: 100px;
            background: #FDFFF5; /* Putih tulang/kuning sangat pucat */
            border-radius: 50%;
            /* Glow bulan yang lembut */
            box-shadow: 0 0 50px 15px rgba(180, 200, 255, 0.4), 
                        inset -15px -15px 20px rgba(0,0,0,0.05);
            animation: pulse-moon 8s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes pulse-moon {
            0% { transform: scale(1); box-shadow: 0 0 50px 15px rgba(180, 200, 255, 0.3); }
            100% { transform: scale(1.03); box-shadow: 0 0 70px 25px rgba(180, 200, 255, 0.6); }
        }

        /* Awan Malam (Lebih Transparan dan Gelap) */
        .clouds-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50vh;
            z-index: 2;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: rgba(140, 150, 180, 0.25); /* Warna awan malam */
            border-radius: 100px;
            filter: blur(4px);
            animation: float-cloud linear infinite;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(140, 150, 180, 0.25);
            border-radius: 50%;
        }

        .cloud1 { width: 150px; height: 50px; top: 18%; left: -200px; animation-duration: 45s; }
        .cloud1::before { width: 70px; height: 70px; top: -30px; left: 20px; }
        .cloud1::after { width: 90px; height: 90px; top: -45px; left: 60px; }

        .cloud2 { width: 100px; height: 35px; top: 35%; left: -150px; animation-duration: 60s; animation-delay: -20s; }
        .cloud2::before { width: 50px; height: 50px; top: -20px; left: 15px; }
        .cloud2::after { width: 60px; height: 60px; top: -30px; left: 40px; }

        .cloud3 { width: 200px; height: 60px; top: 12%; left: -250px; animation-duration: 70s; animation-delay: -35s; }
        .cloud3::before { width: 80px; height: 80px; top: -40px; left: 30px; }
        .cloud3::after { width: 110px; height: 110px; top: -60px; left: 70px; }

        @keyframes float-cloud {
            0% { transform: translateX(-10vw); }
            100% { transform: translateX(110vw); }
        }

        /* ========================================================
           3. TANAH SALJU MALAM
        ======================================================== */
        .snow-ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 35vh;
            /* Salju malam lebih kebiruan/keunguan */
            background: #465573;
            clip-path: ellipse(150% 100% at 50% 100%);
            z-index: 3;
            box-shadow: inset 0 30px 50px rgba(20, 25, 45, 0.4);
        }

        .snow-ground-back {
            position: absolute;
            bottom: 5vh;
            left: -10vw;
            width: 120vw;
            height: 40vh;
            background: #343D5C;
            clip-path: ellipse(100% 100% at 30% 100%);
            z-index: 2;
        }

        /* ========================================================
           4. MANUSIA SALJU & POHON (VERSI MALAM / MUTED)
        ======================================================== */
        .scene-container {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            width: 100vw;
            pointer-events: none;
        }

        .pastel-tree {
            width: 15vw;
            max-width: 120px;
            min-width: 70px;
            margin: 0 2vw;
            animation: sway 8s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        /* Bayangan jatuh kebiruan gelap */
        .tree-left { filter: drop-shadow(0 15px 10px rgba(10, 15, 30, 0.5)); }
        .tree-right { filter: drop-shadow(0 15px 10px rgba(10, 15, 30, 0.5)); animation-delay: -3s; }

        @keyframes sway {
            0% { transform: rotate(-2deg); }
            100% { transform: rotate(2deg); }
        }

        .snowman-wrapper {
            width: 30vw;
            max-width: 250px;
            min-width: 160px;
            filter: drop-shadow(0px 15px 15px rgba(10, 15, 30, 0.6));
            animation: breathe 4s infinite alternate ease-in-out;
            transform-origin: bottom center;
            z-index: 5;
            margin: 0 2vw;
        }

        @keyframes breathe {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.02) translateY(-5px); }
        }

        /* ========================================================
           5. CANVAS PARTIKEL SALJU
        ======================================================== */
        #snowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
        }

        /* Responsive Fix untuk Mobile */
        @media (max-aspect-ratio: 3/4) {
            .pastel-tree { width: 25vw; }
            .snowman-wrapper { width: 45vw; }
            .moon { width: 70px; height: 70px; right: 8vw; top: 6vh; }
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Bintang -->
    <div class="stars-container">
        <div class="star-layer"></div>
        <div class="star-layer"></div>
    </div>

    <!-- Bulan Purnama Malam -->
    <div class="moon"></div>

    <!-- Awan Transparan Malam -->
    <div class="clouds-container">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>

    <!-- Bukit Salju (Warna Malam) -->
    <div class="snow-ground-back"></div>
    <div class="snow-ground"></div>

    <!-- Container Utama: Snowman & Pohon -->
    <div class="scene-container">
        
        <!-- Pohon Pastel Kiri (Mint Gelap Malam) -->
        <svg class="pastel-tree tree-left" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
            <rect x="45" y="130" width="10" height="20" fill="#2E241E" rx="2"/>
            <!-- Daun Segitiga (Muted Mint Green) -->
            <polygon points="50,20 15,70 85,70" fill="#5F8B77" />
            <polygon points="50,50 10,100 90,100" fill="#4B7260" />
            <polygon points="50,80 5,130 95,130" fill="#365646" />
            <path d="M 50,20 Q 30,50 15,70 Q 50,60 85,70 Q 70,50 50,20 Z" fill="rgba(200,210,240,0.5)"/>
        </svg>

        <!-- Manusia Salju (Vektor SVG dengan Shadow Biru Malam) -->
        <div class="snowman-wrapper">
            <svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
                <!-- Definisi Filter Gradasi Salju Malam -->
                <defs>
                    <radialGradient id="snowGradNight" cx="40%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#E2EBF5" /> <!-- Pantulan bulan terang -->
                        <stop offset="70%" stop-color="#9BAFC6" /> <!-- Biru malam pucat -->
                        <stop offset="100%" stop-color="#6783A0" /> <!-- Bayangan biru gelap -->
                    </radialGradient>
                </defs>

                <!-- Badan Bawah -->
                <circle cx="100" cy="180" r="60" fill="url(#snowGradNight)" />
                <!-- Badan Tengah -->
                <circle cx="100" cy="110" r="45" fill="url(#snowGradNight)" />
                <!-- Kepala -->
                <circle cx="100" cy="55" r="35" fill="url(#snowGradNight)" />

                <!-- Kancing (Abu-abu sangat gelap) -->
                <circle cx="100" cy="100" r="4" fill="#2A3238" />
                <circle cx="100" cy="120" r="4" fill="#2A3238" />
                <circle cx="100" cy="165" r="5" fill="#2A3238" />
                <circle cx="100" cy="190" r="5" fill="#2A3238" />

                <!-- Tangan (Ranting Coklat Gelap) -->
                <path d="M 58 105 Q 35 95 20 100" stroke="#4A3B32" stroke-width="4" stroke-linecap="round" fill="none" />
                <path d="M 35 98 Q 25 85 20 85" stroke="#4A3B32" stroke-width="3" stroke-linecap="round" fill="none" />
                
                <path d="M 142 105 Q 165 95 180 100" stroke="#4A3B32" stroke-width="4" stroke-linecap="round" fill="none" />
                <path d="M 165 98 Q 175 85 180 85" stroke="#4A3B32" stroke-width="3" stroke-linecap="round" fill="none" />

                <!-- Syal (Muted Pastel Pink / Mauve) -->
                <path d="M 68 85 Q 100 100 132 85 Q 135 95 125 100 Q 100 105 75 100 Z" fill="#B57A7A" />
                <path d="M 115 95 L 125 140 L 110 145 L 105 98 Z" fill="#9C6262" />
                <!-- Rumbai Syal -->
                <line x1="125" y1="140" x2="128" y2="148" stroke="#B57A7A" stroke-width="2" />
                <line x1="118" y1="142" x2="120" y2="150" stroke="#B57A7A" stroke-width="2" />
                <line x1="110" y1="145" x2="112" y2="153" stroke="#B57A7A" stroke-width="2" />

                <!-- Topi (Biru Denim Gelap) -->
                <rect x="75" y="20" width="50" height="15" fill="#5A6D82" rx="5" />
                <path d="M 85 20 L 85 -5 Q 100 -10 115 -5 L 115 20 Z" fill="#4B5B6D" />
                <!-- Pita Topi (Kuning Mustard Gelap) -->
                <rect x="85" y="10" width="30" height="5" fill="#B8A447" />

                <!-- Mata (Hitam) -->
                <circle cx="88" cy="48" r="3.5" fill="#1C2326" />
                <circle cx="112" cy="48" r="3.5" fill="#1C2326" />
                
                <!-- Pipi (Blush Muted) -->
                <ellipse cx="78" cy="55" rx="6" ry="3" fill="#B57A7A" opacity="0.6" />
                <ellipse cx="122" cy="55" rx="6" ry="3" fill="#B57A7A" opacity="0.6" />

                <!-- Hidung Wortel (Oranye Tua) -->
                <polygon points="100,50 120,56 100,58" fill="#CC8052" />
                
                <!-- Senyum senyum -->
                <path d="M 90 65 Q 100 72 110 65" stroke="#1C2326" stroke-width="2" stroke-linecap="round" fill="none" />
            </svg>
        </div>

        <!-- Pohon Pastel Kanan (Muted Pink/Lavender) -->
        <svg class="pastel-tree tree-right" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
            <rect x="45" y="130" width="10" height="20" fill="#2E241E" rx="2"/>
            <!-- Daun Segitiga (Muted Dusty Pink) -->
            <polygon points="50,20 15,70 85,70" fill="#A8737A" />
            <polygon points="50,50 10,100 90,100" fill="#8C5C62" />
            <polygon points="50,80 5,130 95,130" fill="#6B4248" />
            <path d="M 50,20 Q 30,50 15,70 Q 50,60 85,70 Q 70,50 50,20 Z" fill="rgba(200,210,240,0.5)"/>
        </svg>

    </div>

    <!-- Kanvas untuk Partikel Salju -->
    <canvas id="snowCanvas"></canvas>

    <script>
        /* ========================================================
           6. JAVASCRIPT: SISTEM PARTIKEL SALJU (NIGHT VISION)
        ======================================================== */
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let snowflakes = [];
        
        // Sesuaikan jumlah salju berdasarkan luas layar
        let particleCount = 100; 

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            // Kalkulasi partikel dinamis
            particleCount = Math.floor((width * height) / 12000);
            if (particleCount > 250) particleCount = 250; 
            
            snowflakes = [];
            for (let i = 0; i < particleCount; i++) {
                snowflakes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.5 + 1,      
                    speed: Math.random() * 1.5 + 0.5,     
                    wind: Math.random() * 0.5 - 0.25,     
                    // Transparansi salju sedikit dinaikkan agar lebih kontras di malam hari
                    opacity: Math.random() * 0.6 + 0.4    
                });
            }
        }

        function animateSnow() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            
            for (let i = 0; i < particleCount; i++) {
                let flake = snowflakes[i];
                
                ctx.moveTo(flake.x, flake.y);
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2, true);
                
                flake.y += flake.speed;
                flake.x += flake.wind;
                
                if (flake.y > height) {
                    flake.y = -5;
                    flake.x = Math.random() * width;
                }
                
                if (flake.x > width) flake.x = 0;
                if (flake.x < 0) flake.x = width;
            }
            
            ctx.globalAlpha = 0.7; // Visibilitas salju terhadap langit gelap
            ctx.fill();
            
            requestAnimationFrame(animateSnow);
        }

        initCanvas();
        animateSnow();

        window.addEventListener('resize', () => {
            initCanvas();
        });
    </script>
</body>
</html>
