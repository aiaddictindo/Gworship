<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Music Notes Background</title>
    <style>
        /* * 100% RESPONSIF & FULLSCREEN LOOPING
         * Tidak ada elemen teks/huruf sama sekali di dalam body. 
         */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #fdfbfb;
            /* Latar belakang gradasi pastel yang berputar halus */
            background: linear-gradient(-45deg, #ffe2e2, #e2eafc, #e8fccf, #fce2fc, #fff0d4);
            background-size: 400% 400%;
            animation: softGradientLoop 25s ease infinite;
        }

        @keyframes softGradientLoop {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay kaca untuk memberikan efek modern dan dalam (depth) */
        .glass-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, transparent 0%, rgba(255, 255, 255, 0.15) 100%);
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="glass-overlay"></div>
    <canvas id="musicCanvas"></canvas>

    <script>
        const canvas = document.getElementById('musicCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // Memastikan kanvas selalu pas dengan ukuran layar (Desktop & Mobile)
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Palet warna pastel yang ceria namun lembut
        const pastelColors = [
            '#FF9AA2', // Soft Pink
            '#FFB7B2', // Peach
            '#FFDAC1', // Pastel Orange
            '#E2F0CB', // Pastel Green
            '#B5EAD7', // Mint
            '#C7CEEA', // Periwinkle / Baby Blue
            '#E8Dff5'  // Soft Lavender
        ];

        const notes = [];
        const numNotes = 45; // Jumlah not musik yang melayang

        class PastelNote {
            constructor() {
                this.reset();
                // Saat pertama dimuat, sebar not di seluruh area secara acak
                this.y = Math.random() * height; 
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + (Math.random() * 200 + 50); // Mulai dari bawah layar
                this.size = Math.random() * 0.7 + 0.5; // Skala variatif
                this.speedY = -(Math.random() * 1.5 + 0.8); // Bergerak lembut ke atas
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                this.wobblePhase = Math.random() * Math.PI * 2;
                this.rotation = (Math.random() - 0.5) * 1.5;
                this.rotationSpeed = (Math.random() - 0.5) * 0.01; // Putaran pelan
                this.color = pastelColors[Math.floor(Math.random() * pastelColors.length)];
                this.type = Math.floor(Math.random() * 3) + 1; // 3 bentuk not berbeda
                this.opacity = Math.random() * 0.6 + 0.4;
            }

            update() {
                // Kalkulasi pergerakan melayang + efek goyangan (wobble)
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.wobblePhase) * 0.6;
                this.wobblePhase += this.wobbleSpeed;
                this.rotation += this.rotationSpeed;

                // Jika sudah melewati batas atas layar, reset ke bawah
                if (this.y < -150) {
                    this.reset();
                    this.y = height + 100;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(this.size, this.size);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                
                // Efek cahaya/bayangan (Glow) pada setiap not
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 20;

                // Menggambar murni menggunakan Path API (Tanpa Teks/Font)
                if (this.type === 1) {
                    // Tipe 1: Not Seperempat (Quarter Note)
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 14, 10, -Math.PI / 4, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillRect(8, -55, 5, 55);
                } else if (this.type === 2) {
                    // Tipe 2: Not Seperdelapan (Eighth Note)
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 14, 10, -Math.PI / 4, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillRect(8, -55, 5, 55);
                    // Bendera (Flag)
                    ctx.beginPath();
                    ctx.moveTo(13, -55);
                    ctx.bezierCurveTo(35, -45, 40, -15, 20, 5);
                    ctx.bezierCurveTo(30, -15, 25, -40, 13, -35);
                    ctx.fill();
                } else if (this.type === 3) {
                    // Tipe 3: Dua Not Bergandeng (Beamed Notes)
                    // Not pertama
                    ctx.beginPath();
                    ctx.ellipse(-25, 0, 14, 10, -Math.PI / 4, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillRect(-17, -50, 5, 50);
                    // Not kedua
                    ctx.beginPath();
                    ctx.ellipse(25, -15, 14, 10, -Math.PI / 4, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillRect(33, -65, 5, 50);
                    // Balok penghubung (Beam)
                    ctx.beginPath();
                    ctx.moveTo(-17, -50);
                    ctx.lineTo(38, -65);
                    ctx.lineTo(38, -51);
                    ctx.lineTo(-17, -36);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Inisialisasi kumpulan not musik
        for (let i = 0; i < numNotes; i++) {
            notes.push(new PastelNote());
        }

        // Looping Animasi (60 FPS Mulus)
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            notes.forEach(note => {
                note.update();
                note.draw(ctx);
            });

            requestAnimationFrame(animate);
        }
        
        // Mulai animasi
        animate();
    </script>
</body>
</html>
