<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi Salib Emas Bercahaya</title>
    <style>
        /* Reset margin dan padding, serta menyembunyikan scrollbar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            /* Latar belakang gelap dengan pencahayaan emas lembut di tengah */
            background: radial-gradient(circle at center, #1a1400 0%, #050505 60%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        /* Container Canvas untuk partikel */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Di bawah salib */
            pointer-events: none; /* Agar klik tidak terhalang */
        }

        /* Container untuk Salib */
        #cross-container {
            position: relative;
            z-index: 2; /* Di atas partikel */
            display: flex;
            justify-content: center;
            align-items: center;
            /* Menggunakan vmin agar responsif di semua ukuran layar (mobile/desktop) */
            width: 30vmin;
            height: 45vmin;
            min-width: 150px;
            min-height: 225px;
            perspective: 1000px; /* Kedalaman untuk efek rotasi 3D */
        }

        /* Styling dan Animasi SVG Salib */
        .cross {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.6)) 
                    drop-shadow(0 0 50px rgba(255, 200, 0, 0.3));
            /* Animasi rotasi 3D yang halus dan efek melayang */
            animation: rotate3D 15s linear infinite, float 6s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        /* Keyframes untuk rotasi 3D yang mulus */
        @keyframes rotate3D {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

        /* Keyframes untuk efek melayang perlahan */
        @keyframes float {
            0%, 100% {
                margin-top: 0;
            }
            50% {
                margin-top: -20px;
            }
        }
    </style>
</head>
<body>

    <!-- Layer Partikel -->
    <div id="canvas-container">
        <canvas id="particleCanvas"></canvas>
    </div>

    <!-- Layer Salib -->
    <div id="cross-container">
        <!-- SVG Salib Emas -->
        <svg class="cross" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradien Emas Linier untuk Salib -->
                <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFF5A5; stop-opacity:1" />
                    <stop offset="40%" style="stop-color:#FFD700; stop-opacity:1" />
                    <stop offset="60%" style="stop-color:#DAA520; stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#B8860B; stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <!-- Bentuk Salib -->
            <g fill="url(#goldGradient)">
                <!-- Tiang Vertikal -->
                <rect x="42" y="10" width="16" height="130" rx="4" />
                <!-- Tiang Horizontal -->
                <rect x="15" y="40" width="70" height="16" rx="4" />
            </g>
        </svg>
    </div>

    <!-- Script Logika Partikel JavaScript -->
    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        const particleCount = 100; // Jumlah partikel cahaya

        // Fungsi untuk menyesuaikan ukuran canvas dengan layar
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // Kelas Partikel
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                // Ukuran bervariasi
                this.size = Math.random() * 2 + 0.5;
                // Kecepatan sangat lambat agar terlihat halus
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5 - 0.2; // Sedikit mengarah ke atas
                // Opasitas dan logika kedipan
                this.opacity = Math.random();
                this.fadeSpeed = (Math.random() * 0.02) + 0.005;
                this.fadingOut = Math.random() > 0.5;
            }

            update() {
                // Pergerakan
                this.x += this.speedX;
                this.y += this.speedY;

                // Kedipan (twinkle effect)
                if (this.fadingOut) {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0) {
                        this.fadingOut = false;
                        // Reset posisi saat menghilang untuk efek infinite yang mulus
                        if(Math.random() > 0.8) {
                            this.reset();
                            this.opacity = 0;
                        }
                    }
                } else {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 1) {
                        this.fadingOut = true;
                    }
                }

                // Jika keluar dari layar, kembalikan ke sisi berlawanan
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                // Warna partikel debu emas
                ctx.fillStyle = `rgba(255, 215, 100, ${this.opacity})`;
                ctx.fill();
                
                // Efek glow pada partikel
                ctx.shadowBlur = 10;
                ctx.shadowColor = "rgba(255, 215, 0, 0.8)";
                ctx.closePath();
            }
        }

        // Inisialisasi Partikel
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        // Loop Animasi Partikel
        function animate() {
            // Membersihkan frame sebelumnya
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Perbarui dan gambar setiap partikel
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animate);
        }

        // Setup awal
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        initParticles();
        animate();

    </script>
</body>
</html>
