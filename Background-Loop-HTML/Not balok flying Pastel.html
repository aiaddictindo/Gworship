<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pastel Notes Loop Background</title>
    <style>
        /* FULLSCREEN & RESPONSIVE RESET */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a2e;
        }


        /* ANIMATED PASTEL BACKGROUND (HEMAT GPU) */
        .pastel-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(120deg, #ffc3a0, #ffafbd, #e0c3fc, #8ec5fc);
            background-size: 300% 300%;
            animation: gradientShift 15s ease infinite;
            z-index: 1;
        }


        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }


        /* CANVAS UNTUK NOT BALOK */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: block;
        }
    </style>
</head>
<body>


    <div class="pastel-bg"></div>
    <canvas id="musicCanvas"></canvas>


    <script>
        const canvas = document.getElementById('musicCanvas');
        const ctx = canvas.getContext('2d');


        let width, height;


        // FUNGSI AUTO-FIT RESPONSIVE
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();


        // WARNA PASTEL UNTUK NOT BALOK
        const pastelColors = ['#FFFFFF', '#FFF5BA', '#FFB5E8', '#85E3FF', '#C5A3FF'];


        // KELAS NOT BALOK VEKTOR
        class MusicNote {
            constructor() {
                this.reset(true);
            }


            reset(randomizeX = false) {
                // Muncul dari luar layar sebelah kiri
                this.x = randomizeX ? Math.random() * width : -100 - (Math.random() * 100);
                this.y = Math.random() * (height * 0.8) + (height * 0.1); 
                
                // Kecepatan dan skala (hemat RAM dengan objek sederhana)
                this.speed = Math.random() * 1.5 + 0.5;
                this.scale = Math.random() * 0.6 + 0.4;
                
                // Kedalaman efek paralaks
                if(this.scale > 0.8) this.speed += 1; 


                this.color = pastelColors[Math.floor(Math.random() * pastelColors.length)];
                this.type = Math.floor(Math.random() * 3); // 3 tipe not
                
                // Variabel untuk ayunan terbang (melayang)
                this.bobSpeed = Math.random() * 0.03 + 0.01;
                this.bobOffset = Math.random() * Math.PI * 2;
            }


            update(time) {
                // Bergerak dari kiri ke kanan
                this.x += this.speed;
                this.y += Math.sin(time * this.bobSpeed + this.bobOffset) * 0.5;


                // Jika melewati batas kanan layar, reset ke kiri
                if (this.x > width + 150) {
                    this.reset(false);
                }
            }


            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                ctx.fillStyle = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';


                // Efek cahaya tipis (glowing)
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';


                ctx.beginPath();
                if (this.type === 0) { 
                    // Not 1/4 (Quarter Note)
                    ctx.ellipse(0, 0, 14, 10, -Math.PI / 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.moveTo(12, 0);
                    ctx.lineTo(12, -50);
                    ctx.stroke();
                } else if (this.type === 1) { 
                    // Not 1/8 (Eighth Note)
                    ctx.ellipse(0, 0, 14, 10, -Math.PI / 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.moveTo(12, 0);
                    ctx.lineTo(12, -50);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(12, -50);
                    ctx.bezierCurveTo(30, -40, 30, -20, 15, -15);
                    ctx.stroke();
                } else { 
                    // Not Balok Ganda (Beamed Notes)
                    ctx.ellipse(0, 0, 14, 10, -Math.PI / 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(12, 0);
                    ctx.lineTo(12, -50);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.ellipse(45, -10, 14, 10, -Math.PI / 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(57, -10);
                    ctx.lineTo(57, -60);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(10, -48);
                    ctx.lineTo(59, -58);
                    ctx.lineWidth = 10;
                    ctx.stroke();
                }
                ctx.restore();
            }
        }


        // Object Pooling: Membatasi jumlah not agar hemat memori
        const notes = [];
        const NOTE_COUNT = 30;
        for(let i = 0; i < NOTE_COUNT; i++) {
            notes.push(new MusicNote());
        }


        // OPTIMASI FPS (TIME-DELTA LOGIC)
        let lastTime = 0;
        const targetFPS = 30; // Kunci di 30 FPS untuk hemat CPU/RAM
        const frameInterval = 1000 / targetFPS;
        let globalTime = 0;


        function animate(timestamp) {
            requestAnimationFrame(animate);
            
            const deltaTime = timestamp - lastTime;
            
            if (deltaTime >= frameInterval) {
                lastTime = timestamp - (deltaTime % frameInterval);
                globalTime++;
                
                ctx.clearRect(0, 0, width, height);


                // Update & Render Not
                for (let i = 0; i < notes.length; i++) {
                    notes[i].update(globalTime);
                    notes[i].draw(ctx);
                }
            }
        }


        // Mulai animasi
        requestAnimationFrame(animate);
    </script>
</body>
</html>
