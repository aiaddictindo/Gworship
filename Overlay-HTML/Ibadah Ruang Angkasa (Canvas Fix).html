<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibadah Anak Tengah Minggu - Tema Ruang Angkasa</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Righteous & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Righteous&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            /* Latar Belakang Gradien Ruang Angkasa */
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 70%, #020617 100%);
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
        }

        .font-comic {
            font-family: 'Righteous', cursive;
        }

        /* --- OBJEK RUANG ANGKASA (PLANET & ROKET) --- */
        .planet {
            position: absolute;
            border-radius: 50%;
            z-index: 5;
        }
        
        /* Planet Besar */
        .planet-large {
            width: 300px;
            height: 300px;
            bottom: -100px;
            right: -50px;
            background: radial-gradient(circle at 30% 30%, #f43f5e, #881337);
            box-shadow: inset -20px -20px 40px rgba(0,0,0,0.5), 0 0 50px rgba(244, 63, 94, 0.4);
            animation: spinSlow 40s linear infinite;
        }
        /* Cincin Planet */
        .planet-large::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -20%;
            width: 140%;
            height: 40px;
            background: rgba(253, 164, 175, 0.3);
            border: 2px solid rgba(253, 164, 175, 0.5);
            border-radius: 50%;
            transform: translateY(-50%) rotate(-15deg);
        }

        /* Planet Kecil */
        .planet-small {
            width: 100px;
            height: 100px;
            top: 15%;
            left: 10%;
            background: radial-gradient(circle at 30% 30%, #38bdf8, #0369a1);
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5), 0 0 30px rgba(56, 189, 248, 0.4);
            animation: floatSpace 6s ease-in-out infinite alternate;
        }

        @keyframes spinSlow { 100% { transform: rotate(360deg); } }
        @keyframes floatSpace {
            0% { transform: translateY(0px) translateX(0px); }
            100% { transform: translateY(-20px) translateX(10px); }
        }

        /* Roket Animasi */
        .rocket {
            position: absolute;
            top: 30%;
            right: 20%;
            width: 80px;
            height: 80px;
            animation: flyRocket 8s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes flyRocket {
            0% { transform: translate(0, 0) rotate(45deg); }
            25% { transform: translate(-30px, -20px) rotate(35deg); }
            50% { transform: translate(-50px, 10px) rotate(45deg); }
            75% { transform: translate(-20px, 30px) rotate(55deg); }
            100% { transform: translate(0, 0) rotate(45deg); }
        }

        /* Api Roket (Flicker) */
        .flame {
            animation: flickerFlame 0.1s infinite alternate;
            transform-origin: top;
        }
        @keyframes flickerFlame {
            0% { transform: scaleY(1); opacity: 0.8; }
            100% { transform: scaleY(1.3); opacity: 1; }
        }

        /* --- ANIMASI TEKS --- */
        .text-fade {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: scale(1);
        }
        .text-hidden {
            opacity: 0;
            transform: scale(1.1); /* Zoom in saat hilang */
        }

        /* Efek Teks 3D Futuristik */
        .space-title {
            color: #fcd34d;
            text-transform: uppercase;
            text-shadow: 
                3px 3px 0 #b45309,
                6px 6px 0 #78350f,
                0 0 20px rgba(252, 211, 77, 0.6);
            letter-spacing: 2px;
        }
        
        /* Bar loading lucu */
        @keyframes loadingBar {
            0% { width: 0%; transform: translateX(0); }
            50% { width: 100%; transform: translateX(0); }
            100% { width: 100%; transform: translateX(100%); }
        }
    </style>
</head>
<body class="relative h-screen w-screen flex flex-col items-center justify-center">

    <!-- CANVAS UNTUK BINTANG WARP (Super ringan & anti kedip) -->
    <canvas id="starCanvas" class="absolute inset-0 w-full h-full z-0 pointer-events-none"></canvas>

    <!-- Planet Besar (Kanan Bawah) -->
    <div class="planet planet-large"></div>
    
    <!-- Planet Kecil (Kiri Atas) -->
    <div class="planet planet-small"></div>

    <!-- Roket Animasi (Kanan Atas) -->
    <div class="rocket">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M 50,10 C 65,30 65,70 50,80 C 35,70 35,30 50,10 Z" fill="#f8fafc"/>
            <path d="M 50,10 C 65,30 65,70 50,80 C 35,70 35,30 50,10 Z" fill="url(#metalGradient)"/>
            <path d="M 50,10 C 58,22 59,32 50,35 C 41,32 42,22 50,10 Z" fill="#ef4444"/>
            <circle cx="50" cy="45" r="8" fill="#0ea5e9" stroke="#94a3b8" stroke-width="3"/>
            <path d="M 40,60 L 20,80 L 40,75 Z" fill="#ef4444"/>
            <path d="M 60,60 L 80,80 L 60,75 Z" fill="#ef4444"/>
            <path class="flame" d="M 42,80 Q 50,100 58,80 Q 50,85 42,80 Z" fill="#f59e0b"/>
            
            <defs>
                <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(0,0,0,0.2)" />
                    <stop offset="50%" stop-color="rgba(255,255,255,0.5)" />
                    <stop offset="100%" stop-color="rgba(0,0,0,0.3)" />
                </linearGradient>
            </defs>
        </svg>
    </div>

    <!-- KONTEN UTAMA (Tengah) -->
    <div class="relative z-20 flex flex-col items-center justify-center text-center px-4 w-full max-w-4xl">
        
        <!-- Label Acara -->
        <div class="bg-blue-900/50 backdrop-blur-md rounded-full px-8 py-2 mb-6 border border-blue-400/30">
            <span class="text-blue-200 font-bold text-sm md:text-base tracking-[0.2em] uppercase flex items-center gap-2">
                🚀 Misi Penjelajah Firman Tuhan 🚀
            </span>
        </div>

        <!-- Wadah Teks Berputar -->
        <div class="min-h-[220px] md:min-h-[250px] flex flex-col items-center justify-center w-full">
            <h1 id="mainTitle" class="font-comic space-title text-5xl md:text-7xl lg:text-8xl mb-4 text-fade">
                HALO SUPERKIDS!
            </h1>
            
            <p id="subTitle" class="text-xl md:text-3xl font-bold text-sky-300 tracking-wide text-fade drop-shadow-md max-w-2xl">
                Siap belajar firman Tuhan hari ini?
            </p>
        </div>

        <!-- Progress Bar Loading -->
        <div class="mt-8 w-64 md:w-80 h-3 bg-gray-800 rounded-full overflow-hidden border border-gray-700">
            <div class="h-full bg-gradient-to-r from-cyan-400 to-blue-600 w-full animate-[loadingBar_5s_ease-in-out_infinite]"></div>
        </div>
        <p class="text-[10px] md:text-xs text-gray-400 font-mono mt-2 tracking-widest uppercase">
            Sistem Siap • Menunggu Komando
        </p>

    </div>

    <!-- SKRIP LOGIKA -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. ENGINE BINTANG MENGGUNAKAN CANVAS (Mulus & Anti Kedip) ---
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');
            
            let width, height;
            let stars = [];
            const numStars = 400; // Jumlah bintang
            const speed = 2;      // Kecepatan melesat

            function resizeCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Membuat partikel bintang acak di ruang 3D (x, y, z)
            function initStars() {
                stars = [];
                for (let i = 0; i < numStars; i++) {
                    stars.push({
                        x: (Math.random() - 0.5) * width * 2, // Rentang sebaran
                        y: (Math.random() - 0.5) * height * 2,
                        z: Math.random() * width // Kedalaman
                    });
                }
            }
            initStars();

            function animateStarfield() {
                // Bersihkan frame sebelumnya (transparan agar gradient background di CSS terlihat)
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = 'white';

                for (let i = 0; i < numStars; i++) {
                    let star = stars[i];
                    
                    // Bintang bergerak maju (z berkurang)
                    star.z -= speed;
                    
                    // Jika bintang sudah melewati layar, kembalikan jauh ke belakang
                    if (star.z <= 0) {
                        star.z = width;
                        star.x = (Math.random() - 0.5) * width * 2;
                        star.y = (Math.random() - 0.5) * height * 2;
                    }

                    // Proyeksi 3D ke 2D (Rumus perspektif dasar)
                    let focalLength = width; 
                    let screenX = (star.x / star.z) * focalLength + width / 2;
                    let screenY = (star.y / star.z) * focalLength + height / 2;
                    
                    // Bintang yang dekat (z kecil) akan lebih besar
                    let radius = (1 - star.z / width) * 2.5;
                    
                    // Gambar bintangnya di canvas jika ukurannya positif
                    if (radius > 0) {
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                
                // Terus ulangi frame
                requestAnimationFrame(animateStarfield);
            }
            
            // Mulai animasi
            animateStarfield();


            // --- 2. LOGIKA ROTASI PESAN OTOMATIS ---
            const pesanPenjelajah = [
                { judul: "HALO SUPERKIDS!", sub: "Siap belajar firman Tuhan hari ini?" },
                { judul: "ISI ENERGIMU!", sub: "Fokus dan dengarkan kakak pembina ya 👂" },
                { judul: "3.. 2.. 1..", sub: "Petualangan segera dimulai! 🚀" },
                { judul: "TUHAN HEBAT!", sub: "Dia yang menciptakan alam semesta 🌍" }
            ];

            let indeks = 0;
            const elJudul = document.getElementById('mainTitle');
            const elSub = document.getElementById('subTitle');

            function putarPesan() {
                elJudul.classList.add('text-hidden');
                elSub.classList.add('text-hidden');

                setTimeout(() => {
                    indeks = (indeks + 1) % pesanPenjelajah.length;
                    
                    const warnaSub = ["text-sky-300", "text-green-300", "text-purple-300", "text-pink-300"];
                    elSub.className = `text-xl md:text-3xl font-bold tracking-wide text-fade drop-shadow-md max-w-2xl ${warnaSub[indeks]}`;

                    elJudul.innerText = pesanPenjelajah[indeks].judul;
                    elSub.innerText = pesanPenjelajah[indeks].sub;

                    elJudul.classList.remove('text-hidden');
                    elSub.classList.remove('text-hidden');
                }, 600); 
            }

            setInterval(putarPesan, 6000);
        });
    </script>
</body>
</html>
